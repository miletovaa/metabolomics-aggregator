services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      CONTAINER_ROLE: app
    env_file: .env
    volumes:
      - storage:/var/www/html/storage/app
      - ./storage/app/databases:/var/www/html/storage/app/databases
      - public_html:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Localhost-only: a separate shared Caddy instance owns the public
      # 80/443 ports (this VPS also hosts a second, unrelated site) and
      # reverse-proxies to this port — see the deploy guide's "edge" setup.
      # 8081, not 8080 — some VPS images ship a control-panel agent
      # ("beadmin" or similar) already bound to 8080 on all interfaces.
      - "127.0.0.1:8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_html:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=7200
    env_file: .env
    volumes:
      - storage:/var/www/html/storage/app
      - ./storage/app/databases:/var/www/html/storage/app/databases
    depends_on:
      - app
      - db
      - redis
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file: .env
    depends_on:
      - app
      - db
    restart: unless-stopped

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  dbdata:
  redisdata:
  storage:
  public_html:
