services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      CONTAINER_ROLE: app
    env_file: .env
    volumes:
      - storage:/var/www/html/storage/app
      - ./storage/app/databases:/var/www/html/storage/app/databases
      - public_html:/var/www/html/public
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Localhost-only: a separate shared Caddy instance owns the public
      # 80/443 ports (this VPS also hosts a second, unrelated site) and
      # reverse-proxies to this port — see the deploy guide's "edge" setup.
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_html:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=7200
    env_file: .env
    volumes:
      - storage:/var/www/html/storage/app
      - ./storage/app/databases:/var/www/html/storage/app/databases
    depends_on:
      - app
      - db
      - redis
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file: .env
    depends_on:
      - app
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  public_html:
