; Resource limits sized for this app's compound CSV/XLSX import-export
; (PhpSpreadsheet) and the multi-hour batch compound-mapping jobs.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300

; The queue worker container overrides this per-process via --timeout on the
; artisan command itself; this just keeps the web-facing PHP-FPM pool sane.
date.timezone = UTC
